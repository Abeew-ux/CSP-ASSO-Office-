<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSP/ASSO Office</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
#fiches{display:none}
@media print{
  header,main{display:none!important}
  #fiches{display:grid;grid-template-columns:repeat(2,1fr);gap:6mm;font-family:Arial,sans-serif;color:#000}
  .fiche{border:1px dashed #555;padding:6mm;font-size:13px;page-break-inside:avoid}
}
</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
<header class="bg-blue-900 text-white shadow-md sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <button id="retour" aria-label="Retour" class="hidden w-8 h-8 rounded-lg bg-blue-800"><i class="fa-solid fa-arrow-left"></i></button>
      <span id="titre" class="font-extrabold tracking-wide">CSP/ASSO Office</span>
    </div>
    <div id="barre" class="hidden items-center gap-3 text-sm">
      <span id="qui" class="hidden sm:inline text-blue-200"></span>
      <button id="quitter" class="bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded-lg">Quitter</button>
    </div>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-5">
  <section id="login" class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600 mt-6">
    <h1 class="text-2xl font-bold text-blue-900 mb-1 text-center">Espace du personnel</h1>
    <p class="text-sm text-gray-500 mb-5 text-center">Identifiant et code donnés par l'administration.</p>
    <div class="space-y-4">
      <div><label for="ident" class="block text-sm font-medium mb-1">Identifiant</label>
        <input id="ident" autocomplete="username" autocapitalize="none" class="w-full border rounded-lg px-3 py-2"></div>
      <div><label for="code" class="block text-sm font-medium mb-1">Code</label>
        <input id="code" type="password" autocomplete="current-password" class="w-full border rounded-lg px-3 py-2"></div>
      <p id="erreur" class="hidden text-sm text-red-600"></p>
      <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg">Se connecter</button>
    </div>
  </section>
  <section id="app" class="hidden"><div id="contenu"></div></section>
</main>

<div id="fiches"></div>

<script>
// Clé publique : sans danger ici. Les droits sont contrôlés par la base (RLS) et par l'API sécurisée.
const URL_API = 'https://vgnxmwwvdgyqmthoovwf.supabase.co';
const KEY = 'sb_publishable_rbIdP1IyapQaA6vm73HeIQ_2vMM6VZ6';
const API = '/api/office';
const ANNEE = '2026-2027';

const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mat = (c, n) => `${c}-${String(n).padStart(3, '0')}`;
const TYPES = [['interrogation', 'Interrogation'], ['devoir', 'Devoir'], ['composition', 'Composition']];
const PARENT = { classe: 'home', addclasse: 'home', eleves: 'classe', notes: 'classe', matieres: 'classe', personnel: 'home' };

let token = null, me = null, classes = [], eleves = [], matieres = [], codes = [], equipe = [], S = { v: 'home', classe: null, matiere: null, tri: 'T1', type: 'interrogation', num: 1 };
const admin = () => me && me.role === 'admin';
const clCourante = () => classes.find((c) => c.nom === S.classe);

const saveSession = (v) => { try { v ? sessionStorage.setItem('office_token', v) : sessionStorage.removeItem('office_token'); } catch (e) {} };
const loadSession = () => { try { return sessionStorage.getItem('office_token'); } catch (e) { return null; } };

async function rest(path, opts = {}) {
  const r = await fetch(`${URL_API}/rest/v1/${path}`, { ...opts, headers: { apikey: KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { quitter(); throw new Error('session'); }
  const t = await r.text();
  if (!r.ok) { let m = ''; try { m = JSON.parse(t).message; } catch (e) {} throw new Error(m || `Erreur ${r.status}`); }
  return t ? JSON.parse(t) : null;
}
async function api(action, body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ action, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { quitter(); throw new Error('session'); }
  if (!r.ok) throw new Error(d.erreur || 'Erreur');
  return d;
}
function flash(m, ok) { const e = $('flash'); if (e) { e.textContent = m; e.className = 'text-sm mb-3 ' + (ok ? 'text-green-700' : 'text-red-600'); } }
const FL = '<p id="flash" class="text-sm mb-3"></p>';

/* ---------- connexion ---------- */
function erreur(m) { const e = $('erreur'); e.textContent = m; e.classList.remove('hidden'); }
async function connexion() {
  const ident = $('ident').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  const code = $('code').value;
  $('erreur').classList.add('hidden');
  if (!ident || !code) return erreur('Renseigne ton identifiant et ton code.');
  $('btn-login').disabled = true;
  try {
    const r = await fetch(`${URL_API}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: `${ident}@csp-asso.local`, password: code }) });
    const d = await r.json();
    if (!r.ok || !d.access_token) return erreur('Identifiant ou code incorrect.');
    token = d.access_token; saveSession(token); $('code').value = '';
    await demarrer(d.user.id);
  } catch (e) { erreur('Connexion impossible pour le moment.'); }
  finally { $('btn-login').disabled = false; }
}
function quitter() {
  token = null; me = null; saveSession(null);
  $('app').classList.add('hidden'); $('barre').classList.add('hidden'); $('barre').classList.remove('flex'); $('retour').classList.add('hidden');
  $('titre').textContent = 'CSP/ASSO Office'; $('login').classList.remove('hidden');
}
async function demarrer(userId) {
  try {
    const p = await rest(`personnel?select=nom,role,identifiant&id=eq.${userId}`);
    if (!p.length) { quitter(); return erreur("Ce compte n'a pas accès à l'espace du personnel."); }
    me = p[0];
    $('qui').textContent = `${me.nom} · ${admin() ? 'administration' : 'enseignant'}`;
    $('barre').classList.remove('hidden'); $('barre').classList.add('flex');
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    await charger(); aller('home');
  } catch (e) { if (e.message !== 'session') { quitter(); erreur('Impossible de charger tes données.'); } }
}
async function charger() {
  [classes, eleves, matieres] = await Promise.all([
    rest('classes?select=code,nom,effectif&order=ordre.asc,nom.asc'),
    rest('eleves?select=id,matricule,nom,prenom,classe&order=matricule.asc&limit=2000'),
    rest('matieres?select=id,classe_code,nom,coefficient&order=ordre.asc,nom.asc'),
  ]);
}

/* ---------- navigation ---------- */
function aller(v, classe) {
  if (classe !== undefined) S.classe = classe;
  if (v === 'notes' && S.v !== 'notes') { S.matiere = null; S.tri = 'T1'; S.type = 'interrogation'; S.num = 1; }
  if (v !== 'eleves' && v !== 'personnel') codes = [];
  S.v = v; rendre();
}
function rendre() {
  const c = $('contenu'), cl = clCourante();
  $('retour').classList.toggle('hidden', S.v === 'home');
  $('titre').textContent = S.v === 'home' ? 'CSP/ASSO Office' : S.v === 'addclasse' ? 'Nouvelle classe' : S.v === 'personnel' ? 'Personnel' : S.classe;
  if (S.v !== 'home' && S.v !== 'addclasse' && S.v !== 'personnel' && !cl) return aller('home');
  ({ home: vHome, classe: vClasse, eleves: vEleves, notes: vNotes, matieres: vMatieres, addclasse: vAddClasse, personnel: vPersonnel })[S.v](c, cl);
}

/* ---------- accueil : une case par classe ---------- */
function vHome(c) {
  c.innerHTML = '<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">' + classes.map((x) => {
    const n = eleves.filter((e) => e.classe === x.nom).length;
    return `<button data-go="classe" data-classe="${esc(x.nom)}" class="bg-white rounded-xl shadow p-4 text-left border-t-4 border-blue-600 active:bg-blue-50">
      <div class="font-bold text-lg">${esc(x.nom)}</div><div class="text-xs text-gray-500">${n} élève(s)</div></button>`;
  }).join('') + (admin() ? '<button data-go="addclasse" class="rounded-xl border-2 border-dashed border-gray-300 text-gray-500 p-4">+ Ajouter une classe</button><button data-go="personnel" class="rounded-xl bg-blue-900 text-white p-4 text-left"><div class="font-bold"><i class="fa-solid fa-users mr-2"></i>Personnel</div><div class="text-xs opacity-80">Comptes des enseignants</div></button>' : '') + '</div>' +
  (classes.length ? '' : '<p class="text-center text-gray-500 mt-6">Aucune classe pour le moment.</p>');
}

/* ---------- menu d'une classe ---------- */
function vClasse(c, cl) {
  const o = (v, ico, t, d) => `<button data-go="${v}" class="w-full bg-white rounded-xl shadow p-4 flex items-center gap-4 text-left active:bg-blue-50">
    <i class="fa-solid ${ico} text-blue-600 text-xl w-6 text-center"></i><div><div class="font-semibold">${t}</div><div class="text-xs text-gray-500">${d}</div></div></button>`;
  c.innerHTML = FL + '<div class="space-y-3">' + o('notes', 'fa-pen', 'Notes', 'Choisir la matière et le trimestre') +
    (admin() ? o('eleves', 'fa-user-plus', 'Élèves', 'Ajouter, modifier, supprimer') + o('matieres', 'fa-book', 'Matières', 'Ajouter ou retirer des matières') +
    '<button data-act="delclasse" class="w-full text-red-600 text-sm py-3">Supprimer cette classe</button>' : '') + '</div>';
}

/* ---------- élèves ---------- */
function vEleves(c, cl) {
  const mine = eleves.filter((e) => e.classe === cl.nom), par = Object.fromEntries(mine.map((e) => [e.matricule, e]));
  let rows = '';
  for (let n = 1; n <= cl.effectif; n++) {
    const m = mat(cl.code, n), e = par[m];
    rows += `<div class="flex items-center gap-2 px-3 py-2">
      <span class="w-16 shrink-0 text-xs font-mono ${e ? 'text-green-700' : 'text-gray-400'}">${m}</span>
      <input data-m="${m}" data-f="nom" data-orig="${esc(e ? e.nom + '|' + e.prenom : '')}" value="${esc(e && e.nom)}" placeholder="Nom" class="min-w-0 flex-1 border rounded-lg px-2 py-1.5 text-sm">
      <input data-m="${m}" data-f="prenom" value="${esc(e && e.prenom)}" placeholder="Prénom" class="min-w-0 flex-1 border rounded-lg px-2 py-1.5 text-sm">
      ${e ? `<button data-reset="${m}" aria-label="Nouveau code" class="text-blue-600 px-1"><i class="fa-solid fa-key"></i></button><button data-del="${m}" aria-label="Supprimer" class="text-red-500 px-1"><i class="fa-solid fa-trash"></i></button>` : '<span class="w-12"></span>'}</div>`;
  }
  const motif = new RegExp(`^${cl.code}-\\d{3}$`);
  const autres = mine.filter((e) => !motif.test(e.matricule) || Number(e.matricule.split('-')[1]) > cl.effectif);
  c.innerHTML = FL + `<p class="text-xs text-gray-500 mb-2">${mine.length} élève(s) sur ${cl.effectif} places</p>
    <div id="grille" class="bg-white rounded-xl shadow overflow-hidden divide-y">${rows}</div>` +
    (autres.length ? '<div class="bg-white rounded-xl shadow p-4 mt-4"><h3 class="font-semibold text-sm mb-2">Autres élèves de cette classe</h3>' + autres.map((e) =>
      `<div class="flex justify-between items-center text-sm py-1"><span><span class="font-mono text-xs text-gray-500">${esc(e.matricule)}</span> ${esc(e.nom)} ${esc(e.prenom)}</span><button data-del="${esc(e.matricule)}" class="text-red-500 px-1"><i class="fa-solid fa-trash"></i></button></div>`).join('') + '</div>' : '') +
    (mine.length ? '<button data-act="fiches-classe" class="w-full mt-4 bg-white border border-blue-600 text-blue-700 font-semibold py-2.5 rounded-lg"><i class="fa-solid fa-print mr-1"></i>Fiches de codes de toute la classe</button>' : '') +
    '<button data-act="save-eleves" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg sticky bottom-3 shadow-lg"><i class="fa-solid fa-floppy-disk mr-1"></i>Enregistrer</button>' +
    (codes.length ? `<div class="bg-white p-5 rounded-xl shadow-md border-t-4 border-green-500 mt-6"><h2 class="font-bold mb-1">Codes de connexion</h2>
      <p class="text-sm text-red-600 mb-3">À noter maintenant : ces codes ne seront plus affichés.</p>
      <table class="w-full text-sm text-left"><tbody>${codes.map((x) => `<tr class="border-t"><td class="py-1 font-mono">${esc(x.matricule)}</td><td>${esc(x.nom)} ${esc(x.prenom)}</td><td class="font-mono font-bold">${esc(x.code)}</td></tr>`).join('')}</tbody></table>
      <div class="flex gap-2 mt-4"><button data-act="copier" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 rounded-lg font-medium"><i class="fa-solid fa-copy mr-1"></i>Copier</button><button data-act="imprimer" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-medium"><i class="fa-solid fa-print mr-1"></i>Imprimer</button></div></div>` : '');
}
async function saveEleves() {
  const cl = clCourante(), lignes = {};
  document.querySelectorAll('#grille input').forEach((i) => {
    (lignes[i.dataset.m] ||= { matricule: i.dataset.m })[i.dataset.f] = i.value.trim();
    if (i.dataset.orig !== undefined) lignes[i.dataset.m].orig = i.dataset.orig;
  });
  const liste = Object.values(lignes).filter((l) => (l.nom || l.prenom) && `${l.nom}|${l.prenom}` !== (l.orig || ''));
  if (!liste.length) return flash('Rien à enregistrer.', false);
  const inc = liste.filter((l) => !l.nom || !l.prenom);
  if (inc.length) return flash(`Nom ET prénom obligatoires (${inc.map((l) => l.matricule).join(', ')}).`, false);
  flash('Enregistrement…', true);
  try {
    const d = await api('enregistrer_eleves', { classe: cl.nom, eleves: liste.map(({ matricule, nom, prenom }) => ({ matricule, nom, prenom })) });
    await charger(); codes = d.crees; rendre();
    let m = `${d.crees.length} élève(s) créé(s), ${d.modifies} modifié(s).`;
    if (d.erreurs.length) m += ` Problèmes : ${d.erreurs.slice(0, 5).join(' ; ')}`;
    flash(m, !d.erreurs.length);
    if (d.crees.length) window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  } catch (e) { if (e.message !== 'session') flash(e.message, false); }
}
async function supprimerEleve(m) {
  if (!confirm(`Supprimer l'élève ${m} avec ses notes et son bulletin ? Cette action est définitive.`)) return;
  try { await api('supprimer_eleve', { matricule: m }); await charger(); rendre(); } catch (e) { if (e.message !== 'session') alert(e.message); }
}

function imprimer() {
  $('fiches').innerHTML = codes.map((c) => `<div class="fiche"><div style="font-weight:bold;margin-bottom:6px">CSP ASSO · Espace Notes</div>
    <div>${esc(c.nom)} ${esc(c.prenom)}</div><div>Classe : ${esc(S.classe)}</div>
    <div style="margin-top:6px">Matricule : <b>${esc(c.matricule)}</b></div>
    <div>Code : <b style="font-size:18px;letter-spacing:2px">${esc(c.code)}</b></div>
    <div style="font-size:11px;margin-top:8px">Connexion : csp-asso.vercel.app, bouton « Espace Notes »</div></div>`).join('');
  window.print();
}
async function fichesClasse() {
  const cl = clCourante(), n = eleves.filter((e) => e.classe === cl.nom).length;
  if (!n) return flash('Aucun élève dans cette classe.', false);
  if (!confirm(`Générer de NOUVEAUX codes pour les ${n} élèves de ${cl.nom} ? Les anciens codes ne marcheront plus.`)) return;
  flash('Génération des codes…', true);
  try {
    const d = await api('reset_classe', { classe: cl.nom });
    codes = d.codes; rendre();
    flash(d.erreurs.length ? `Problèmes : ${d.erreurs.slice(0, 5).join(' ; ')}` : `${d.codes.length} code(s) générés. Imprime-les maintenant.`, !d.erreurs.length);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  } catch (e) { if (e.message !== 'session') flash(e.message, false); }
}
async function resetCode(m) {
  const e = eleves.find((x) => x.matricule === m);
  if (!e || !confirm(`Générer un nouveau code pour ${e.prenom} ${e.nom} (${m}) ? L'ancien code ne marchera plus.`)) return;
  try {
    const d = await api('reset_code', { matricule: m });
    codes = [{ matricule: m, nom: e.nom, prenom: e.prenom, code: d.code }]; rendre();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  } catch (err) { if (err.message !== 'session') flash(err.message, false); }
}

/* ---------- notes ---------- */
const chip = (att, val, txt, actif) => `<button ${att}="${esc(val)}" class="px-3 py-1.5 rounded-lg text-sm border ${actif ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700'}">${esc(txt)}</button>`;
async function vNotes(c, cl) {
  const ms = matieres.filter((m) => m.classe_code === cl.code);
  c.innerHTML = FL + `<div class="bg-white rounded-xl shadow p-4 mb-4">
    <p class="text-sm font-medium mb-2">Matière</p>
    <div class="flex flex-wrap gap-2 mb-4">${ms.map((m) => chip('data-mat', m.nom, m.nom, m.nom === S.matiere)).join('')}${admin() ? '<button data-go="matieres" class="px-3 py-1.5 rounded-lg text-sm border border-dashed text-gray-500">+ Matière</button>' : ''}</div>
    <p class="text-sm font-medium mb-2">Trimestre</p>
    <div class="flex gap-2 mb-4">${['T1', 'T2', 'T3'].map((t) => chip('data-tri', t, t, t === S.tri)).join('')}</div>
    <p class="text-sm font-medium mb-2">Évaluation</p>
    <div class="flex flex-wrap gap-2 mb-3">${TYPES.map(([v, t]) => chip('data-type', v, t, v === S.type)).join('')}</div>
    <div class="flex gap-2">${[1, 2, 3, 4].map((n) => chip('data-num', n, `N° ${n}`, n === S.num)).join('')}</div></div><div id="liste-notes"></div>`;
  const zone = $('liste-notes');
  if (!ms.length) return zone.innerHTML = '<p class="text-center text-gray-500">Aucune matière pour cette classe.' + (admin() ? ' Ajoute-en avec « + Matière ».' : ' Demande à l\'administration d\'en ajouter.') + '</p>';
  if (!S.matiere) return zone.innerHTML = '<p class="text-center text-gray-500">Choisis une matière.</p>';
  const el = eleves.filter((e) => e.classe === cl.nom).sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom, 'fr'));
  if (!el.length) return zone.innerHTML = '<p class="text-center text-gray-500">Aucun élève dans cette classe.</p>';
  let ex = [];
  try { ex = await rest(`notes?select=eleve_id,note&matiere=eq.${encodeURIComponent(S.matiere)}&trimestre=eq.${S.tri}&type=eq.${S.type}&numero=eq.${S.num}&annee_scolaire=eq.${ANNEE}&eleve_id=in.(${el.map((e) => e.id).join(',')})`); }
  catch (e) { if (e.message === 'session') return; flash('Impossible de charger les notes.', false); }
  const par = Object.fromEntries(ex.map((x) => [x.eleve_id, x.note]));
  zone.innerHTML = `<div class="bg-white rounded-xl shadow overflow-hidden divide-y">${el.map((e) => `<div class="flex items-center gap-3 px-3 py-2">
    <span class="flex-1 min-w-0 text-sm">${esc(e.nom)} ${esc(e.prenom)} <span class="text-xs text-gray-400">${esc(e.matricule)}</span></span>
    <input data-e="${e.id}" data-orig="${par[e.id] ?? ''}" value="${par[e.id] ?? ''}" inputmode="decimal" placeholder="/20" class="w-20 text-center border rounded-lg px-2 py-1.5"></div>`).join('')}</div>
    <button data-act="save-notes" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg sticky bottom-3 shadow-lg"><i class="fa-solid fa-floppy-disk mr-1"></i>Enregistrer</button>`;
}
async function saveNotes() {
  const cl = clCourante(), m = matieres.find((x) => x.classe_code === cl.code && x.nom === S.matiere);
  const ajouts = [], suppr = [], err = [];
  document.querySelectorAll('#liste-notes input[data-e]').forEach((i) => {
    const v = i.value.trim().replace(',', '.'), o = i.dataset.orig;
    if (v === '') { if (o !== '') suppr.push(i.dataset.e); return; }
    const n = Number(v);
    if (!isFinite(n) || n < 0 || n > 20) return err.push(i.closest('div').querySelector('span').textContent.trim());
    if (o === '' || n !== Number(o)) ajouts.push({ eleve_id: i.dataset.e, matiere: S.matiere, trimestre: S.tri, type: S.type, numero: S.num, annee_scolaire: ANNEE, note: n, coefficient: m ? m.coefficient : 1 });
  });
  if (err.length) return flash(`Note invalide (0 à 20) : ${err.slice(0, 3).join(', ')}`, false);
  if (!ajouts.length && !suppr.length) return flash('Rien à enregistrer.', false);
  flash('Enregistrement…', true);
  try {
    await Promise.all(suppr.map((id) => rest(`notes?eleve_id=eq.${id}&matiere=eq.${encodeURIComponent(S.matiere)}&trimestre=eq.${S.tri}&type=eq.${S.type}&numero=eq.${S.num}&annee_scolaire=eq.${ANNEE}`, { method: 'DELETE' })));
    if (ajouts.length) await rest('notes?on_conflict=eleve_id,matiere,trimestre,annee_scolaire,type,numero', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(ajouts) });
    await vNotes($('contenu'), cl); flash(`Notes enregistrées (${ajouts.length + suppr.length} modification(s)).`, true);
  } catch (e) { if (e.message !== 'session') flash(e.message, false); }
}

/* ---------- matières (administration) ---------- */
function vMatieres(c, cl) {
  const ms = matieres.filter((m) => m.classe_code === cl.code);
  c.innerHTML = FL + `<div class="bg-white rounded-xl shadow overflow-hidden divide-y mb-5">${ms.map((m) => `<div class="flex items-center justify-between px-4 py-3">
    <span>${esc(m.nom)} <span class="text-xs text-gray-400">coef. ${m.coefficient}</span></span><button data-delmat="${m.id}" class="text-red-500 px-1" aria-label="Retirer"><i class="fa-solid fa-trash"></i></button></div>`).join('') || '<p class="p-4 text-gray-500 text-sm">Aucune matière pour cette classe.</p>'}</div>
    <div class="bg-white rounded-xl shadow p-4"><h2 class="font-bold mb-3">Ajouter une matière</h2>
      <div class="grid grid-cols-3 gap-2 mb-3">
        <div class="col-span-2"><label class="block text-xs font-medium mb-1" for="m-nom">Nom</label><input id="m-nom" maxlength="60" placeholder="ex. Mathématiques" class="w-full border rounded-lg px-3 py-2"></div>
        <div><label class="block text-xs font-medium mb-1" for="m-coef">Coef.</label><input id="m-coef" type="number" value="1" min="0.5" max="20" step="0.5" class="w-full border rounded-lg px-3 py-2"></div></div>
      <label class="flex items-center gap-2 text-sm mb-3"><input id="m-toutes" type="checkbox"> Ajouter aussi à toutes les autres classes</label>
      <button data-act="add-matiere" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg">Ajouter</button>
      <p class="text-xs text-gray-500 mt-3">Retirer une matière ne supprime pas les notes déjà saisies.</p></div>`;
}
async function addMatiere() {
  const cl = clCourante(), nom = $('m-nom').value.trim(), coef = Number($('m-coef').value) || 1, toutes = $('m-toutes').checked;
  if (!nom) return flash('Écris le nom de la matière.', false);
  const cibles = toutes ? classes : [cl];
  try {
    await rest('matieres?on_conflict=classe_code,nom', { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates,return=minimal' },
      body: JSON.stringify(cibles.map((x) => ({ classe_code: x.code, nom, coefficient: coef, ordre: matieres.filter((m) => m.classe_code === x.code).length + 1 }))) });
    await charger(); rendre(); flash(toutes ? 'Matière ajoutée à toutes les classes.' : 'Matière ajoutée.', true);
  } catch (e) { if (e.message !== 'session') flash(e.message, false); }
}
async function delMatiere(id) {
  if (!confirm('Retirer cette matière de la classe ? Les notes déjà saisies sont conservées.')) return;
  try { await rest(`matieres?id=eq.${id}`, { method: 'DELETE' }); await charger(); rendre(); } catch (e) { if (e.message !== 'session') alert(e.message); }
}

/* ---------- classes (administration) ---------- */
function vAddClasse(c) {
  c.innerHTML = FL + `<div class="bg-white rounded-xl shadow p-4"><div class="grid grid-cols-3 gap-2 mb-3">
    <div class="col-span-3 sm:col-span-1"><label class="block text-xs font-medium mb-1" for="c-nom">Nom</label><input id="c-nom" maxlength="40" placeholder="ex. 3eC" class="w-full border rounded-lg px-3 py-2"></div>
    <div><label class="block text-xs font-medium mb-1" for="c-code">Début matricule</label><input id="c-code" maxlength="6" placeholder="ex. 3C" class="w-full border rounded-lg px-3 py-2 uppercase"></div>
    <div><label class="block text-xs font-medium mb-1" for="c-eff">Places</label><input id="c-eff" type="number" value="40" min="1" max="200" class="w-full border rounded-lg px-3 py-2"></div></div>
    <button data-act="add-classe" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg">Ajouter la classe</button></div>`;
}
async function addClasse() {
  const nom = $('c-nom').value.trim(), code = $('c-code').value.trim().toUpperCase(), effectif = Number($('c-eff').value);
  if (!nom || !/^[A-Z0-9]{1,6}$/.test(code) || !(effectif >= 1 && effectif <= 200)) return flash('Nom, début de matricule (lettres/chiffres) et places (1 à 200) obligatoires.', false);
  try {
    await rest('classes', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ code, nom, effectif, ordre: classes.length + 1 }) });
    await charger(); aller('home');
  } catch (e) { if (e.message !== 'session') flash(/duplicate|unique/i.test(e.message) ? 'Ce nom ou ce début de matricule existe déjà.' : e.message, false); }
}
async function supprimerClasse() {
  const cl = clCourante();
  const saisi = prompt(`Supprimer la classe ${cl.nom} et TOUS ses élèves, notes et bulletins ?\nTape le nom de la classe pour confirmer :`);
  if (saisi === null) return;
  try { const d = await api('supprimer_classe', { code: cl.code, confirmation: saisi }); await charger(); aller('home'); alert(`Classe supprimée (${d.supprimes} élève(s)).`); }
  catch (e) { if (e.message !== 'session') alert(e.message); }
}


/* ---------- personnel (admin) ---------- */
async function vPersonnel(c) {
  if (!admin()) return aller('home');
  try { equipe = await rest('personnel?select=id,identifiant,nom,role&order=nom.asc'); } catch (e) { if (e.message === 'session') return; }
  c.innerHTML = FL + (codes.length ? `<div class="bg-yellow-50 border border-yellow-300 rounded-xl p-4 mb-4"><p class="font-bold">${esc(codes[0].nom)}</p>
    <p class="text-sm">Identifiant : <b>${esc(codes[0].identifiant)}</b></p><p class="text-sm">Code : <b class="text-lg tracking-widest">${esc(codes[0].code)}</b></p>
    <p class="text-xs text-red-600 mt-1">Note ce code maintenant : il ne sera plus affiché.</p></div>` : '') +
    `<div class="bg-white rounded-xl shadow overflow-hidden divide-y mb-5">${equipe.map((p) => `<div class="flex items-center justify-between px-4 py-3 gap-2">
    <span class="min-w-0"><span class="font-medium">${esc(p.nom)}</span> <span class="text-xs text-gray-400">${esc(p.identifiant)} · ${p.role === 'admin' ? 'administration' : 'enseignant'}</span></span>
    <span class="shrink-0"><button data-resetp="${esc(p.identifiant)}" class="text-blue-600 px-2" aria-label="Nouveau code"><i class="fa-solid fa-key"></i></button>${p.identifiant === (me.identifiant || '') ? '' : `<button data-delp="${esc(p.identifiant)}" class="text-red-500 px-2" aria-label="Supprimer"><i class="fa-solid fa-trash"></i></button>`}</span></div>`).join('')}</div>
    <div class="bg-white rounded-xl shadow p-4"><h2 class="font-bold mb-3">Ajouter un compte</h2>
      <label class="block text-xs font-medium mb-1" for="p-nom">Nom complet</label><input id="p-nom" maxlength="60" placeholder="ex. Abdou Moussa" class="w-full border rounded-lg px-3 py-2 mb-3">
      <label class="block text-xs font-medium mb-1" for="p-role">Rôle</label><select id="p-role" class="w-full border rounded-lg px-3 py-2 mb-3"><option value="prof">Enseignant (saisit les notes)</option><option value="admin">Administration (tout faire)</option></select>
      <button data-act="add-pers" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg">Créer le compte</button></div>`;
}
async function persAction(action, body, ok) {
  try { const d = await api(action, body); codes = d.code ? [d] : []; await vPersonnel($('contenu')); flash(ok, true); }
  catch (e) { if (e.message !== 'session') flash(e.message, false); }
}

/* ---------- évènements ---------- */
$('btn-login').addEventListener('click', connexion);
$('code').addEventListener('keydown', (e) => e.key === 'Enter' && connexion());
$('quitter').addEventListener('click', quitter);
$('retour').addEventListener('click', () => aller(PARENT[S.v] || 'home'));
document.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  let x;
  if ((x = t('[data-go]'))) return aller(x.dataset.go, x.dataset.classe);
  if ((x = t('[data-mat]'))) { S.matiere = x.dataset.mat; return rendre(); }
  if ((x = t('[data-tri]'))) { S.tri = x.dataset.tri; return rendre(); }
  if ((x = t('[data-type]'))) { S.type = x.dataset.type; S.num = 1; return rendre(); }
  if ((x = t('[data-num]'))) { S.num = Number(x.dataset.num); return rendre(); }
  if ((x = t('[data-resetp]'))) return confirm('Créer un nouveau code pour ce compte ?') && persAction('reset_personnel', { identifiant: x.dataset.resetp }, 'Nouveau code créé.');
  if ((x = t('[data-delp]'))) return confirm('Supprimer ce compte ?') && persAction('supprimer_personnel', { identifiant: x.dataset.delp }, 'Compte supprimé.');
  if ((x = t('[data-reset]'))) return resetCode(x.dataset.reset);
  if ((x = t('[data-del]'))) return supprimerEleve(x.dataset.del);
  if ((x = t('[data-delmat]'))) return delMatiere(x.dataset.delmat);
  if ((x = t('[data-act]'))) {
    const a = x.dataset.act;
    if (a === 'add-pers') return persAction('creer_personnel', { nom: $('p-nom').value, role: $('p-role').value }, 'Compte créé.');
    if (a === 'save-eleves') return saveEleves();
    if (a === 'save-notes') return saveNotes();
    if (a === 'add-matiere') return addMatiere();
    if (a === 'add-classe') return addClasse();
    if (a === 'delclasse') return supprimerClasse();
    if (a === 'fiches-classe') return fichesClasse();
    if (a === 'imprimer') return imprimer();
    if (a === 'copier') return navigator.clipboard.writeText(codes.map((c) => `${c.matricule}\t${c.nom} ${c.prenom}\t${c.code}`).join('\n')).then(() => { x.textContent = 'Copié'; }).catch(() => alert('Copie impossible.'));
  }
});

token = loadSession();
if (token) { try { demarrer(JSON.parse(atob(token.split('.')[1])).sub); } catch (e) { quitter(); } }
</script>
</body>
</html>
